name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JSON metadata and chronology
        run: python scripts/validate_metadata.py
      - name: Validate with optimized Python
        run: python -O scripts/validate_metadata.py
      - name: Compile Python utilities
        run: python -m py_compile scripts/validate_metadata.py analysis/audio_probe.py

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Lean 4 coordinate-swap proof
        uses: leanprover/lean-action@v1.5.0
